# Project-scoped subagent settings; leave the primary UI model untouched.
# Read-only investigations use explorer. The generic fallback stays at the Sol
# production-code floor instead of inheriting an expensive primary model.
[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "medium"

[agents.explorer]
description = "Read-only investigation agent"
config_file = "agents/explorer.toml"

[agents.worker]
description = "Bounded Sol implementation agent"
config_file = "agents/worker.toml"
