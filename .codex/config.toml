# Project settings only. Scheduling: AGENTS.md; role instructions: agents/*.toml.
# Keep the primary UI model unset; per-role/cumulative caps are behavioral.
[agents]
enabled = true
max_concurrent_threads_per_session = 8
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "xhigh"

[agents.explorer]
description = "Luna Max for location-only file discovery, reading-heavy investigation, evidence analysis and existing low-cost, non-critical read-only batch tests."
config_file = "agents/explorer.toml"

[agents.worker]
description = "GPT-6.1 Sol for guided implementation and debugging, including complex multi-file work, with owned paths and minimal necessary checks; default xhigh, with high/xhigh/max selected by the primary agent."
config_file = "agents/worker.toml"
