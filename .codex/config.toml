# Project settings only; primary-agent scheduling rules live in AGENTS.md.
# Per-role instructions live in agents/*.toml. Never pin the primary UI model here.
[agents]
enabled = true
max_concurrent_threads_per_session = 8
default_subagent_model = "gpt-6-sol"
default_subagent_reasoning_effort = "high"

[agents.explorer]
description = "Luna Max for bounded, reading-heavy investigation and independent evidence checks."
config_file = "agents/explorer.toml"

[agents.worker]
description = "Sol for bounded implementation with explicit file ownership and acceptance criteria."
config_file = "agents/worker.toml"
