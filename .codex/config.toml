# Project-scoped subagent defaults; never override the primary UI model.
# Per-role concurrent and per-package cumulative limits are scheduled in AGENTS.md.
[agents]
enabled = true
max_concurrent_threads_per_session = 5
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "high"

[agents.explorer]
description = "Luna Max read-only investigator for concrete, independent, verifiable tasks"
config_file = "agents/explorer.toml"

[agents.worker]
description = "Bounded Sol implementation agent; High by default, explicit High/Xhigh/Max"
config_file = "agents/worker.toml"
