# Project settings only. Scheduling: AGENTS.md; role instructions: agents/*.toml.
# Keep the primary UI model unset; per-role/cumulative caps are behavioral.
[agents]
enabled = true
max_concurrent_threads_per_session = 8
default_subagent_model = "gpt-6-sol"
default_subagent_reasoning_effort = "high"

[agents.explorer]
description = "Luna Max for independent, reading-heavy investigation, evidence analysis and existing low-cost, non-critical read-only batch tests."
config_file = "agents/explorer.toml"

[agents.worker]
description = "Sol for bounded ordinary implementation with a settled approach, explicit file ownership and related lightweight tests."
config_file = "agents/worker.toml"
