# P1 team pilot on one Linux VM; not the P4 self-hosting bundle.
name: yuban-p1
services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: yuban
      POSTGRES_DB: yuban
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U yuban -d yuban']
      interval: 5s
      timeout: 3s
      retries: 15
    logging: &bounded-logs
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  api:
    image: yuban-p1-api:local
    build: {context: ../.., target: server}
    restart: unless-stopped
    env_file: ['${P1_PRIVATE_DIR:?Set absolute private directory}/server.env']
    secrets: [storage_key]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [database, outbound]
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *bounded-logs
  web:
    image: yuban-p1-web:local
    build: {context: ../.., target: web}
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set public DNS name}
    ports: ['80:80', '443:443']
    depends_on:
      api: {condition: service_healthy}
    networks: [outbound]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging: *bounded-logs
  maintenance:
    profiles: [ops]
    image: yuban-p1-maintenance:local
    build: {context: ../.., target: maintenance}
    env_file: ['${P1_PRIVATE_DIR:?Set absolute private directory}/server.env']
    environment:
      BACKUP_KEY_FILE: /run/secrets/backup_key
      AI_ENABLED: 'false'
    secrets: [storage_key, backup_key]
    networks: [database]
    volumes:
      - type: bind
        source: ${P1_BACKUP_DIR:?Set absolute protected backup directory}
        target: /backups
        bind: {create_host_path: false}
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *bounded-logs
secrets:
  db_password:
    file: ${P1_PRIVATE_DIR}/db_password
  storage_key:
    file: ${P1_PRIVATE_DIR}/storage.key
  backup_key:
    file: ${P1_PRIVATE_DIR}/backup.key
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
networks:
  database: {internal: true}
  outbound:
