# Replacement composition for the same VM/site, not an override layered on the SQL stack.
name: yuban-p1
x-logs: &bounded-logs
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
x-runtime: &runtime
  image: yuban-firestore-api:${RELEASE_TAG:-local}
  build: {context: ../.., target: firebase-server}
  restart: unless-stopped
  env_file: ['${P1_PRIVATE_DIR:?Set absolute protected directory}/firebase.env']
  secrets: [storage_key]
  networks: [outbound]
  read_only: true
  tmpfs: ['/tmp:size=32m,mode=1777']
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  stop_grace_period: 25s
  logging: *bounded-logs
services:
  api:
    <<: *runtime
    environment:
      STORAGE_BACKEND: firestore
      STORAGE_KEY_FILE: /run/secrets/storage_key
      HOST: 0.0.0.0
      PORT: '3001'
      TRUSTED_PROXY_IP: ${P1_PROXY_IP:-172.30.51.3}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *runtime
    command: [node, server/firebase-worker-main.ts]
    environment:
      STORAGE_BACKEND: firestore
      STORAGE_KEY_FILE: /run/secrets/storage_key
      HOST: 0.0.0.0
      PORT: '3002'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    image: yuban-firestore-web:${RELEASE_TAG:-local}
    build:
      context: ../..
      target: web
      args:
        CADDY_CONFIG: deploy/p1/Caddyfile.firestore
        EXPO_PUBLIC_AUTH_PROVIDER: firebase
        EXPO_PUBLIC_FIREBASE_API_KEY: ${EXPO_PUBLIC_FIREBASE_API_KEY:?Set public Firebase Web SDK API key}
        EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN:?Set Firebase Auth domain}
        EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${EXPO_PUBLIC_FIREBASE_PROJECT_ID:?Set Firebase project}
        EXPO_PUBLIC_FIREBASE_APP_ID: ${EXPO_PUBLIC_FIREBASE_APP_ID:?Set Firebase Web app ID}
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set existing public DNS name}
      API_UPSTREAM: ${API_UPSTREAM:-api:3001}
      FIREBASE_WORKER_UPSTREAM: ${FIREBASE_WORKER_UPSTREAM:-worker:3002}
    ports: ['80:80', '443:443']
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_healthy}
    networks:
      outbound:
        ipv4_address: ${P1_PROXY_IP:-172.30.51.3}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging: *bounded-logs
secrets:
  storage_key:
    file: ${P1_PRIVATE_DIR}/storage.key
volumes:
  caddy-data:
  caddy-config:
networks:
  outbound:
    ipam:
      config:
        - subnet: ${P1_PROXY_SUBNET:-172.30.51.0/28}
