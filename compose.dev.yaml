# Local development databases only; this is not the P4 deployment bundle.
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: yuban
      POSTGRES_DB: yuban
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run npm run setup:local first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuban -d yuban"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres-test:
    profiles: ["test"]
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: yuban
      POSTGRES_DB: yuban_s06_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Run npm run setup:local first}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuban -d yuban_s06_test"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  postgres-test-data:
