name: search-source-progress-offline

on:
  pull_request:
    paths:
      - "src/shared/agent-feedback.ts"
      - "server/agent-feedback-stream.ts"
      - "server/product-agent-tools.ts"
      - "server/product-agent.ts"
      - "src/client/chat-controller.ts"
      - "frontend/src/components/chat/OfficialHelpCards.tsx"
      - "frontend/src/screens/chatScreen.tsx"
      - "tests/agent-feedback-sources.test.ts"
      - "tests/agent-feedback.test.ts"
      - "scripts/ci/verify-search-source-progress-offline.sh"
      - ".github/workflows/search-source-progress-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies cleanly from lockfile
        run: npm ci --ignore-scripts

      - name: Run offline verification gate
        run: bash scripts/ci/verify-search-source-progress-offline.sh
