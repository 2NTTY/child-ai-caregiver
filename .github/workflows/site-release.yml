name: Production website
run-name: ${{ inputs.operation == 'catchup' && format('Daily website catch-up {0}', inputs.slot) || 'Production website' }}
on:
  schedule:
    # UTC; 04:17 the following day in Hong Kong.
    - cron: '17 20 * * *'
    # Temporary control, using the same recurring UTC slots as github.com/cli/cli.
    # Admit up to two native timer events before the first regular daily slot.
    - cron: '9,39 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Website operation
        type: choice
        options: [run, pause, resume, rollback, catchup]
        default: run
      release_id:
        description: Compatible release ID (rollback only)
        type: string
      slot:
        description: UTC slot date (overdue scheduler only)
        type: string
permissions:
  contents: read
concurrency:
  group: production-website
  cancel-in-progress: false
jobs:
  timer-control:
    if: github.event_name == 'schedule' && github.event.schedule == '9,39 * * * *'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    timeout-minutes: 2
    outputs:
      admit: ${{ steps.limit.outputs.admit }}
    steps:
      - id: limit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/site-release.yml/runs?event=schedule&branch=master&per_page=1" --jq .total_count)
          [[ "$count" =~ ^[0-9]+$ ]]
          if (( count <= 2 )) && [[ $(date -u +%FT%TZ) < '2026-11-12T20:17:00Z' ]]; then echo 'admit=true' >> "$GITHUB_OUTPUT"; fi
  check:
    needs: timer-control
    if: >-
      !cancelled() && github.repository == '2NTTY/child-ai-caregiver' && github.ref == 'refs/heads/master' &&
      ((github.event_name != 'schedule' && inputs.operation != 'catchup') || vars.SITE_DAILY_ENABLED == 'true') &&
      (needs.timer-control.result == 'skipped' || needs.timer-control.outputs.admit == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: site-observe
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      decision: ${{ steps.plan.outputs.decision }}
      web: ${{ steps.plan.outputs.web }}
      backend: ${{ steps.plan.outputs.backend }}
    steps:
      - name: Record GitHub timer
        if: github.event_name == 'schedule'
        env:
          MATCHED_CRON: ${{ github.event.schedule }}
        run: printf 'GitHub timer (UTC) %s\n' "$MATCHED_CRON" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/1064034424208/locations/global/workloadIdentityPools/github-site-release/providers/github
          service_account: site-observer@ai-caregivers-for-children.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - id: plan
        run: python3 deploy/site-release/controller.py plan
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_ACCESS_TOKEN: ${{ steps.identity.outputs.access_token }}
          OPERATION: ${{ inputs.operation == 'catchup' && 'run' || inputs.operation || 'run' }}
          ROLLBACK_ID: ${{ inputs.release_id }}
          REVIEWED_HOST_PREREQUISITES: ${{ vars.SITE_REVIEWED_PREREQUISITES }}
      - name: Check required Firestore indexes
        if: steps.plan.outputs.backend == 'true'
        run: node scripts/firestore-indexes.mjs --release-check
        env:
          SITE_ACCESS_TOKEN: ${{ steps.identity.outputs.access_token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-preflight-${{ github.run_attempt }}
          path: status.json
          if-no-files-found: error
          retention-days: 1
  build:
    needs: check
    if: needs.check.outputs.decision == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: site-preflight-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-preflight
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - run: bash scripts/site-release/build.sh
        env:
          WEB: ${{ needs.check.outputs.web }}
          BACKEND: ${{ needs.check.outputs.backend }}
          EXPO_PUBLIC_AUTH_PROVIDER: firebase
          EXPO_PUBLIC_AUTH_PROVIDERS: ${{ vars.EXPO_PUBLIC_AUTH_PROVIDERS }}
          EXPO_PUBLIC_ACCOUNT_LEGACY_TRIAL: ${{ vars.EXPO_PUBLIC_ACCOUNT_LEGACY_TRIAL }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-images/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: [check, build]
    if: always() && needs.check.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && contains(fromJSON('["pause","resume","rollback"]'), needs.check.outputs.decision)))
    runs-on: ubuntu-latest
    timeout-minutes: 32
    environment: site-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      WEB: ${{ needs.check.outputs.web }}
      BACKEND: ${{ needs.check.outputs.backend }}
      DECISION: ${{ needs.check.outputs.decision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: site-preflight-${{ github.run_attempt }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: env.DECISION == 'run'
        with:
          name: site-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-images
      - id: identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/1064034424208/locations/global/workloadIdentityPools/github-site-release/providers/github
          service_account: site-publisher@ai-caregivers-for-children.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - name: Publish verified images
        if: env.DECISION == 'run'
        env:
          SITE_ACCESS_TOKEN: ${{ steps.identity.outputs.access_token }}
        run: |
          bash scripts/site-release/publish-images.sh
          cp "$RUNNER_TEMP/digests.json" digests.json
      - name: Submit release and await original receipt
        run: python3 deploy/site-release/controller.py publish
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_ACCESS_TOKEN: ${{ steps.identity.outputs.access_token }}
          ROLLBACK_ID: ${{ inputs.release_id }}
  report:
    needs: [check, build, publish]
    if: always() && needs.check.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: site-observe
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/1064034424208/locations/global/workloadIdentityPools/github-site-release/providers/github
          service_account: site-observer@ai-caregivers-for-children.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - run: python3 deploy/site-release/controller.py report
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_ACCESS_TOKEN: ${{ steps.identity.outputs.access_token }}
          DECISION: ${{ needs.check.outputs.decision }}
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-status
          overwrite: true
          path: status.json
          if-no-files-found: warn
          retention-days: 30
  notify:
    needs: [report]
    if: always() && needs.report.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: site-status
          path: site-status
      - run: node scripts/site-release/notify.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_WORKFLOW_RESULT: ${{ needs.report.result }}
