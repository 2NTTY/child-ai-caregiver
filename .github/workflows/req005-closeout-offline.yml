name: req005-closeout-offline

on:
  pull_request:
    branches:
      - master
      - main
      - codex/req005-acceptance-closeout
    paths:
      - tests/req005-acceptance-scenarios.test.ts
      - PLAN.md
      - WORKLOG.md
      - scripts/ci/verify-req005-closeout-offline.sh
      - .github/workflows/req005-closeout-offline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-req005-closeout-offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: bash scripts/ci/verify-req005-closeout-offline.sh
