    <path d="M182 238C188 242 194 241 199 237" fill="none" stroke-width="3"/>
    <circle cx="177" cy="223" r="2.5" fill="#203E3A" stroke="none"/>
    <circle cx="201" cy="222" r="2.5" fill="#203E3A" stroke="none"/>
  </g>
  <!-- Notes are held by the caregiver, separate from the conversation. -->
  <g id="held-notes" transform="rotate(-12 245 327)" stroke="#203E3A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="207" y="288" width="78" height="84" rx="9" fill="#FFFFFF"/>
    <path d="M224 309H267M224 325H261M224 341H249" fill="none" stroke="#60756E" stroke-width="3"/>
  </g>
  <!-- Dialogue and light are the assistant metaphor, never a robot. -->
  <g id="guiding-dialogue" stroke="#203E3A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
