<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="assistant-title assistant-desc">
  <title id="assistant-title">一起整理下一步</title>
  <desc id="assistant-desc">照顧者拿着筆記，與帶有指引光的對話框交流。兩個相接的對話框代表理解、補問與草擬，不把助手畫成機械人，也不表示 AI 可自行保存資料。</desc>
  <rect width="640" height="480" fill="#FAF7EF"/>
  <path d="M106 259C85 176 148 111 227 120C285 77 371 93 415 135C503 130 555 205 528 276C507 338 429 373 337 374H201C144 365 118 326 106 259Z" fill="#DDE8DB"/>
  <ellipse cx="312" cy="388" rx="188" ry="17" fill="#DDE8DB"/>
