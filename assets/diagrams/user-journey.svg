<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif">
  <title id="title">育有方由日常記錄到照顧跟進的使用者旅程</title>
  <desc id="desc">已確認設計及分階段規劃。日常輸入由 P1 文字、P2 照片及 P3 語音逐步加入。P2 補問與必要確認後，Server 確認才顯示已保存。P2 在授權內主動聯絡，P3 加入完整家庭交接。P2 提供簡單摘要，P4 加入趨勢與 PDF。斷線只保留當頁輸入，恢復連線後由使用者重試。</desc>
  <rect width="1440" height="720" fill="#FAF7EF"/>
  <g id="heading">
    <text x="56" y="78" fill="#203E3A" font-size="44" font-weight="700">從一句記錄，走到下一步照顧</text>
    <rect x="944" y="38" width="440" height="52" rx="26" fill="#DDE8DB"/>
    <text x="1164" y="73" text-anchor="middle" fill="#203E3A" font-size="28">已確認設計／分階段規劃</text>
    <text x="56" y="136" fill="#60756E" font-size="30">整理值得記、值得問、值得跟進的事情</text>
  </g>
  <g id="journey-connections" fill="none" stroke="#287568" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M296 366H315 M309 359L317 366L309 373"/>
    <path d="M568 366H587 M581 359L589 366L581 373"/>
    <path d="M840 366H859 M853 359L861 366L853 373"/>
    <path d="M1112 366H1131 M1125 359L1133 366L1125 373"/>
  </g>
  <g id="daily-input">
    <rect x="56" y="216" width="240" height="330" rx="26" fill="#FFFFFF" stroke="#DDE8DB" stroke-width="3"/>
    <circle cx="108" cy="272" r="28" fill="#DDE8DB"/>
    <text x="108" y="283" text-anchor="middle" fill="#203E3A" font-size="30" font-weight="700">01</text>
    <text x="80" y="348" fill="#203E3A" font-size="34" font-weight="700">日常輸入</text>
    <text x="80" y="408" fill="#60756E" font-size="30">P1 文字</text>
    <text x="80" y="453" fill="#60756E" font-size="30">P2 照片</text>
    <text x="80" y="498" fill="#60756E" font-size="30">P3 語音</text>
  </g>
  <g id="clarify-content">
    <rect x="328" y="216" width="240" height="330" rx="26" fill="#FFFFFF" stroke="#DDE8DB" stroke-width="3"/>
    <rect x="352" y="244" width="58" height="56" rx="14" fill="#287568"/>
    <text x="381" y="283" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="700">02</text>
    <text x="352" y="348" fill="#203E3A" font-size="34" font-weight="700">釐清內容</text>
    <text x="352" y="408" fill="#60756E" font-size="30">重要資料補問</text>
    <text x="352" y="453" fill="#60756E" font-size="30">必要時確認</text>
    <text x="352" y="510" fill="#287568" font-size="28" font-weight="700">P2</text>
  </g>
  <g id="server-save">
    <rect x="600" y="216" width="240" height="330" rx="26" fill="#DDE8DB" stroke="#287568" stroke-width="3"/>
    <circle cx="652" cy="272" r="28" fill="#287568"/>
    <text x="652" y="283" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="700">03</text>
    <text x="624" y="348" fill="#203E3A" font-size="34" font-weight="700">可靠保存</text>
    <text x="624" y="408" fill="#203E3A" font-size="30">Server 確認</text>
    <text x="624" y="453" fill="#203E3A" font-size="30">才顯示已保存</text>
    <text x="624" y="510" fill="#287568" font-size="28" font-weight="700">P1 起</text>
  </g>
  <g id="authorized-follow-up">
    <rect x="872" y="216" width="240" height="330" rx="26" fill="#FFFFFF" stroke="#DDE8DB" stroke-width="3"/>
    <path d="M900 247H946L960 272L946 297H900L886 272Z" fill="#D99A3D"/>
    <text x="923" y="283" text-anchor="middle" fill="#203E3A" font-size="30" font-weight="700">04</text>
    <text x="896" y="348" fill="#203E3A" font-size="34" font-weight="700">授權跟進</text>
    <text x="896" y="408" fill="#60756E" font-size="30">P2 主動聯絡</text>
    <text x="896" y="453" fill="#60756E" font-size="30">P3 家庭交接</text>
    <text x="896" y="510" fill="#287568" font-size="28" font-weight="700">授權內自動執行</text>
  </g>
  <g id="review-and-prepare">
    <rect x="1144" y="216" width="240" height="330" rx="26" fill="#FFFFFF" stroke="#DDE8DB" stroke-width="3"/>
    <path d="M1196 240L1228 272L1196 304L1164 272Z" fill="#C86D52"/>
    <text x="1196" y="283" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="700">05</text>
    <text x="1168" y="348" fill="#203E3A" font-size="34" font-weight="700">回顧準備</text>
    <text x="1168" y="408" fill="#60756E" font-size="30">P2 簡單摘要</text>
    <text x="1168" y="453" fill="#60756E" font-size="30">P4 趨勢／PDF</text>
    <text x="1168" y="510" fill="#287568" font-size="28" font-weight="700">來源可回查</text>
  </g>
  <g id="offline-boundary">
    <rect x="56" y="596" width="1328" height="92" rx="24" fill="#DDE8DB"/>
    <circle cx="104" cy="642" r="10" fill="#D99A3D"/>
    <text x="136" y="653" fill="#203E3A" font-size="32" font-weight="700">斷線：保留當頁輸入 → 連線後由使用者重試</text>
  </g>
</svg>
